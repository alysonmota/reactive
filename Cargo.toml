[package]
name = "reactive"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["experiments/typed-runtime"]
default-members = ["."]
resolver = "3"

[features]
default = []
diagnostics = []
verification = []
experimental-inline-reads = ["dep:smallvec"]

[dependencies]
smallvec = { version = "=1.16.3", optional = true }

[dev-dependencies]
typed-runtime-prototype = { path = "experiments/typed-runtime" }
criterion = "=0.8.2"
leptos_reactive = "=0.6.15"
sycamore-reactive = "=0.9.4"
stats_alloc = "=0.1.10"
serde_json = "=1.0.154"

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "p1p2_memory"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["diagnostics"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.fast-dev]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 64
lto = false
panic = "abort"
