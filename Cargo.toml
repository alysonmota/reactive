[package]
name = "reactive"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["experiments/typed-runtime"]
default-members = ["."]
resolver = "3"

[features]
default = []
diagnostics = []
verification = []
experimental-inline-reads = ["dep:smallvec"]
paint-flash = []

[dependencies]
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
raw-window-handle = "0.6"
vello_cpu = { version = "0.3", default-features = false, features = [
  "std",
  "u8_pipeline",
] }

smallvec = { version = "=1.16.3", optional = true }
taffy = { version = "0.15.0", default-features = false, features = [
  "std",
  "flexbox",
  "taffy_tree",
] }
tiny-skia = "0.12"
cosmic-text = "0.19"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
typed-runtime-prototype = { path = "experiments/typed-runtime" }
criterion = "=0.8.2"
leptos_reactive = "=0.6.15"
sycamore-reactive = "=0.9.4"
stats_alloc = "=0.1.10"
serde_json = "=1.0.154"

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "p1p2_memory"
harness = false

[[bench]]
name = "walk_diagnostic"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["diagnostics"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.bench-abort]
inherits = "release"
panic = "abort"

[profile.fast-dev]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 64
lto = false
panic = "abort"
